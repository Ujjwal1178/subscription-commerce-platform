# Alembic Configuration for Auth Service

[alembic]
# Path to migration scripts
script_location = app/migrations

# Prepend to sys.path
prepend_sys_path = .

# Version path separator
version_path_separator = os

# Database URL - will be overridden by env.py from environment variable
sqlalchemy.url = postgresql://postgres:postgres@postgres:5432/auth_db

[post_write_hooks]
# None for now

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
